name: ci.yaml - medicojob-api-gateway

on:
  push:
    branches:
      - feature-branch
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  SERVICE_NAME: medicojob-api-gateway
  RUNTIME: node
  SONAR_PROJECT_KEY: MedicoJobs_medicojob-api-gateway

jobs:
  pipeline:
    uses: ./.github/workflows/ci_service_pipeline.yml
    with:
      service_name: api-gateway
      service_path: .
      sonar_project_key: medicojob-api-gateway
      sonar_token_secret_name: SONAR_TOKEN
    secrets: inherit

